<?xml version="1.0" encoding="UTF-8"?>
<!-- Trineo de La Casita de Ginger: Ginger conduce un trineo con regalos tirado por un reno.
     Las animaciones internas (regalos que rebotan y patas del reno) van dentro del archivo;
     el vuelo de un lado a otro se controla desde css/estilos.css. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <style>
    .regalo { transform-box: fill-box; transform-origin: center bottom; animation: rebotar 1.6s ease-in-out infinite; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .5s; }
    .patas path { transform-box: fill-box; transform-origin: top center; animation: galopar .5s ease-in-out infinite alternate; }
    .patas .pata-b { animation-direction: alternate-reverse; }
    @keyframes rebotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }
    @keyframes galopar { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
              <!-- Reno -->
              <g class="reno">
                <path d="M222 38 l-6-14 M216 28 l-7-4 M222 38 l4-15 M225 27 l7-5" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round" fill="none"/>
                <ellipse cx="248" cy="62" rx="30" ry="14" fill="#9B6234"/>
                <path d="M266 58 q12-16 6-30" stroke="#9B6234" stroke-width="9" stroke-linecap="round" fill="none"/>
                <ellipse cx="276" cy="28" rx="12" ry="8" fill="#9B6234"/>
                <circle cx="288" cy="30" r="4" fill="#E2262B"/>
                <circle cx="275" cy="25" r="1.8" fill="#2E1505"/>
                <path d="M270 19 l-3-12 M267 11 l-6-3 M274 19 l4-12 M277 10 l6-3" stroke="#6B3E1A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <g class="patas" stroke="#7A4A22" stroke-width="4" stroke-linecap="round">
                  <path class="pata-a" d="M232 72 l-8 16"/><path class="pata-b" d="M242 74 l4 16"/>
                  <path class="pata-a" d="M258 74 l-6 16"/><path class="pata-b" d="M268 72 l8 14"/>
                </g>
                <path d="M222 60 q-8 -6 -14 2" stroke="#9B6234" stroke-width="5" stroke-linecap="round" fill="none"/>
              </g>
              <!-- Riendas -->
              <path d="M150 62 Q190 76 236 58" stroke="#E8B04B" stroke-width="2" fill="none"/>
              <!-- Regalos -->
              <g class="regalo r1"><rect x="40" y="34" width="34" height="28" rx="3" fill="#3E8E4F"/><rect x="54" y="34" width="6" height="28" fill="#E8B04B"/><path d="M57 34 q-10-12-14-2 M57 34 q10-12 14-2" stroke="#E8B04B" stroke-width="3" fill="none"/></g>
              <g class="regalo r2"><rect x="78" y="40" width="28" height="22" rx="3" fill="#2F6DB5"/><rect x="78" y="48" width="28" height="5" fill="#FDF0E1"/><path d="M92 40 q-8-10-11-1 M92 40 q8-10 11-1" stroke="#FDF0E1" stroke-width="3" fill="none"/></g>
              <g class="regalo r3"><rect x="58" y="14" width="26" height="22" rx="3" fill="#C8302B"/><rect x="68" y="14" width="6" height="22" fill="#E8B04B"/><path d="M71 14 q-8-10-11-1 M71 14 q8-10 11-1" stroke="#E8B04B" stroke-width="3" fill="none"/></g>
              <!-- Ginger conduciendo -->
              <g class="ginger-trineo">
                <circle cx="128" cy="34" r="11" fill="#C4561F"/>
                <path d="M118 46 h20 v16 h-20 z" fill="#C4561F"/>
                <path d="M138 50 l12 6" stroke="#C4561F" stroke-width="6" stroke-linecap="round"/>
                <circle cx="124" cy="32" r="1.8" fill="#2E1505"/><circle cx="132" cy="32" r="1.8" fill="#2E1505"/>
                <path d="M123 38 q5 4 10 0" stroke="#FDF0E1" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <circle cx="128" cy="52" r="1.8" fill="#FDF0E1"/><circle cx="128" cy="58" r="1.8" fill="#FDF0E1"/>
                <path d="M116 26 q12-16 24 0 z" fill="#C8302B"/><circle cx="140" cy="24" r="3.5" fill="#FFFFFF"/>
              </g>
              <!-- Trineo -->
              <path d="M24 58 H160 q8 0 6 10 l-6 14 q-3 6 -10 6 H40 q-14 0 -16 -14 z" fill="#A53E14"/>
              <path d="M24 58 H160" stroke="#E8B04B" stroke-width="4" stroke-linecap="round"/>
              <path d="M30 74 h120" stroke="#E8B04B" stroke-width="2" stroke-dasharray="4 6"/>
              <path d="M40 88 v10 M140 88 v10" stroke="#E8B04B" stroke-width="3"/>
              <path d="M14 98 H176 q14 0 16 -12" stroke="#E8B04B" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
