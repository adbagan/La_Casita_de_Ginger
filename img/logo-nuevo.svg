<?xml version="1.0" encoding="UTF-8"?>
<!-- Propuesta de ícono para La Casita de Ginger: casita de jengibre con techo nevado, glaseado,
     chimenea con humo, bastón de caramelo y estrellas, sobre fondo café redondeado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#6B3414"/>
      <stop offset="1" stop-color="#2E1505"/>
    </radialGradient>
    <linearGradient id="muro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4561F"/>
      <stop offset="1" stop-color="#A53E14"/>
    </linearGradient>
    <clipPath id="borde"><rect x="8" y="8" width="496" height="496" rx="112"/></clipPath>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#fondo)"/>
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#E8B04B" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>

  <!-- Estrellas -->
  <g fill="#E8B04B">
    <path d="M96 120 l8 18 20 2 -15 13 5 20 -18 -11 -18 11 5 -20 -15 -13 20 -2z"/>
    <path d="M410 150 l5 11 12 1 -9 8 3 12 -11 -7 -11 7 3 -12 -9 -8 12 -1z"/>
    <circle cx="150" cy="80" r="5"/><circle cx="380" cy="92" r="4"/><circle cx="440" cy="230" r="4"/>
  </g>

  <!-- Chimenea y humo -->
  <path d="M330 160 q-10 -30 12 -46 q-20 -18 6 -40" fill="none" stroke="#FDF0E1" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <rect x="312" y="150" width="44" height="70" rx="6" fill="#7A3A14"/>
  <rect x="304" y="140" width="60" height="20" rx="8" fill="#FDF0E1"/>

  <!-- Muro de la casita -->
  <rect x="128" y="250" width="256" height="190" rx="14" fill="url(#muro)"/>
  <!-- Techo con nieve y glaseado -->
  <path d="M96 268 L256 128 L416 268 Z" fill="#482109" stroke="#482109" stroke-width="20" stroke-linejoin="round"/>
  <path d="M96 268 L256 128 L416 268" fill="none" stroke="#FDF0E1" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M110 276 q18 26 36 0 q18 26 36 0 q18 26 36 0 q18 26 38 0 q18 26 36 0 q18 26 36 0 q18 26 36 0 q14 22 30 0"
        fill="none" stroke="#FDF0E1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Caramelo del techo -->
  <circle cx="256" cy="206" r="24" fill="#FDF0E1"/>
  <circle cx="256" cy="206" r="16" fill="#C8302B"/>
  <path d="M244 200 q12 -8 24 4" stroke="#FDF0E1" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Ventanas -->
  <g>
    <rect x="156" y="300" width="58" height="56" rx="8" fill="#E8B04B" stroke="#FDF0E1" stroke-width="8"/>
    <path d="M185 300 v56 M156 328 h58" stroke="#FDF0E1" stroke-width="6"/>
    <rect x="298" y="300" width="58" height="56" rx="8" fill="#E8B04B" stroke="#FDF0E1" stroke-width="8"/>
    <path d="M327 300 v56 M298 328 h58" stroke="#FDF0E1" stroke-width="6"/>
  </g>
  <!-- Puerta -->
  <path d="M226 440 V352 a30 30 0 0 1 60 0 V440 Z" fill="#482109" stroke="#FDF0E1" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="273" cy="398" r="6" fill="#E8B04B"/>
  <!-- Botones de dulce en el muro -->
  <circle cx="170" cy="400" r="11" fill="#C8302B"/><circle cx="342" cy="400" r="11" fill="#3E8E4F"/>
  <circle cx="200" cy="420" r="7" fill="#E8B04B"/><circle cx="312" cy="420" r="7" fill="#E8B04B"/>

  <!-- Bastón de caramelo -->
  <g transform="translate(448 334) rotate(10)">
    <path d="M0 120 V20 a26 26 0 0 0 -52 0" fill="none" stroke="#FDF0E1" stroke-width="18" stroke-linecap="round"/>
    <path d="M0 120 V20 a26 26 0 0 0 -52 0" fill="none" stroke="#C8302B" stroke-width="18" stroke-linecap="round" stroke-dasharray="12 12"/>
  </g>

  <!-- Nieve en el suelo -->
  <path clip-path="url(#borde)" d="M0 450 q90 -30 180 -6 q76 -26 152 0 q90 -28 180 4 V512 H0 Z" fill="#FDF0E1"/>
</svg>
