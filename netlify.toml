# Configuración de despliegue en Netlify para La Casita de Ginger.
# Es un sitio estático: no hay comando de compilación y se publica la carpeta raíz del repositorio.
[build]
  publish = "."
  command = ""

# El catálogo publicado (productos, testimonios y comentarios) se revisa en cada visita,
# para que los cambios se vean apenas se suben.
[[headers]]
  for = "/js/catalogo-datos.js"
  [headers.values]
    Cache-Control = "no-cache"

# Cabeceras básicas de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
